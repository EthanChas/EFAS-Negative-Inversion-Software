[project]
name = "photoeditor"
version = "0.1.0"
description = "A photo editing desktop app."
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "Pillow>=10.0",
    "rawpy>=0.19",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[project.scripts]
photoeditor = "photoeditor.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoeditor"]
