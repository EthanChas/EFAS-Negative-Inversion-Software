[project]
name = "photoeditor"
dynamic = ["version"]
description = "EFAS Negative Inversion Software: a film-negative photo editor built with PyQt6."
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "Pillow>=10.0",
    "rawpy>=0.19",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
]

[project.scripts]
photoeditor = "photoeditor.__main__:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/photoeditor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/photoeditor"]
